<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lokalé — Discover What's Made Locally</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2ECDD;
    --card:#FBF8F1;
    --ink:#2B2A22;
    --ink-soft:#6b6455;
    --gold:#A9822F;
    --gold-deep:#7C5E22;
    --leaf:#5C6B47;
    --line:#DCD2B6;
    --white:#fff;
    --shadow: 0 1px 2px rgba(43,42,34,.06);
    --radius: 3px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces', serif;
    font-weight:500;
    letter-spacing:-0.01em;
    margin:0;
  }
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  ::selection{background:var(--gold); color:var(--white);}
  :focus-visible{outline:2px solid var(--gold-deep); outline-offset:2px;}

  /* ---------- layout shells ---------- */
  .app{max-width:1100px;margin:0 auto;padding:0 24px;}
  .hide{display:none !important;}

  /* ---------- header ---------- */
  header.site{
    padding:36px 24px 22px;
    text-align:center;
    border-bottom:1px solid var(--line);
    background:
      radial-gradient(ellipse at top, rgba(169,130,47,0.06), transparent 60%),
      var(--paper);
  }
  .logo-mark{width:min(220px, 46vw); height:auto; display:inline-block;}
  header.site .tagline{
    margin-top:6px;
    font-size:13px;
    letter-spacing:.14em;
    color:var(--gold-deep);
    font-weight:600;
  }
  nav.site{
    display:flex; justify-content:center; gap:28px;
    margin-top:18px; font-size:13.5px; color:var(--ink-soft);
  }
  nav.site a{text-decoration:none; padding-bottom:3px; border-bottom:1px solid transparent;}
  nav.site a:hover{color:var(--ink); border-color:var(--gold);}
  nav.site .cart-link{position:relative; font-weight:600; color:var(--ink);}
  .cart-count{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:17px; height:17px; padding:0 4px; margin-left:5px;
    background:var(--gold-deep); color:#fff; border-radius:50%;
    font-size:10.5px; font-weight:700; vertical-align:2px;
  }

  /* ---------- hero ---------- */
  .hero{
    padding:46px 24px 10px; text-align:center;
  }
  .hero .top-rule, .hero .bottom-rule{
    width:64px; height:1px; background:var(--gold); opacity:.55; margin:0 auto 22px;
  }
  .hero .bottom-rule{ margin:30px auto 0; }
  .hero .kicker{
    color:var(--gold-deep); font-size:12.5px; letter-spacing:.22em; font-weight:600;
    margin-bottom:18px;
  }
  .hero h2{font-size:clamp(30px,5vw,46px); line-height:1.18; max-width:680px; margin:0 auto;}
  .hero h2 .accent{
    display:block; font-style:italic; font-weight:500; color:var(--gold-deep);
    font-size:1.02em;
  }
  .hero p{max-width:520px; margin:20px auto 0; color:var(--ink-soft); font-size:15.5px; line-height:1.7;}

  /* ---------- product grid ---------- */
  .catalog{padding:34px 24px 120px;}
  .catalog-head{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:1px solid var(--line); padding-bottom:12px; margin-bottom:26px;
  }
  .catalog-head h3{font-size:22px;}
  .catalog-head span{font-size:12.5px; color:var(--ink-soft);}
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:22px;
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    display:flex; flex-direction:column; overflow:hidden;
    transition:box-shadow .18s ease, transform .18s ease;
  }
  .card:hover{box-shadow:0 10px 24px rgba(43,42,34,.08); transform:translateY(-2px);}
  .card .photo{
    width:100%; aspect-ratio:1/1; background:#EFE8D6 center/cover no-repeat;
    position:relative; border-bottom:1px solid var(--line);
  }
  .card .photo .no-img{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--gold-deep); opacity:.35; font-family:'Fraunces',serif; font-size:13px;
  }
  .card .body{padding:14px 16px 16px; display:flex; flex-direction:column; gap:6px; flex:1;}
  .card h4{font-size:16.5px; font-weight:500;}
  .card .desc{font-size:12.8px; color:var(--ink-soft); line-height:1.5; min-height:18px; flex:1;}
  .card .row{display:flex; align-items:center; justify-content:space-between; margin-top:6px;}
  .price{font-family:'Fraunces',serif; font-size:17px; color:var(--gold-deep);}
  .stepper{display:flex; align-items:center; border:1px solid var(--line); border-radius:20px; overflow:hidden;}
  .stepper button{
    width:26px; height:26px; border:0; background:transparent; font-size:15px; color:var(--ink);
  }
  .stepper button:hover{background:var(--paper);}
  .stepper .qty{width:22px; text-align:center; font-size:13px; font-variant-numeric:tabular-nums;}
  .add-btn{
    margin-top:10px; width:100%; padding:9px 0; border:1px solid var(--ink);
    background:var(--ink); color:var(--paper); border-radius:20px;
    font-size:12.8px; letter-spacing:.04em; font-weight:600; transition:opacity .15s;
  }
  .add-btn:hover{opacity:.85;}
  .add-btn.added{background:var(--leaf); border-color:var(--leaf);}
  .empty-catalog{
    text-align:center; padding:60px 20px; color:var(--ink-soft); font-size:14px;
    border:1px dashed var(--line); border-radius:var(--radius);
  }

  /* ---------- sticky order tray ---------- */
  .tray{
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    display:flex; justify-content:center; pointer-events:none;
  }
  .tray-inner{
    pointer-events:auto;
    background:var(--ink); color:var(--paper);
    display:flex; align-items:center; gap:16px;
    padding:13px 22px; border-radius:30px; margin-bottom:18px;
    box-shadow:0 14px 30px rgba(0,0,0,.25);
    transform:translateY(120%); transition:transform .3s ease;
    font-size:14px;
  }
  .tray-inner.show{transform:translateY(0);}
  .tray-inner b{font-family:'Fraunces',serif; font-weight:500; color:var(--gold);}
  .tray-inner button{
    background:var(--gold); color:var(--ink); border:0; padding:8px 18px; border-radius:20px;
    font-weight:700; font-size:12.8px; letter-spacing:.03em;
  }

  /* ---------- cart / checkout modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(43,42,34,.45); z-index:60;
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .overlay.show{opacity:1; pointer-events:auto;}
  @media (min-width:640px){ .overlay{align-items:center;} }
  .sheet{
    background:var(--paper); width:100%; max-width:480px; max-height:88vh; overflow-y:auto;
    border-radius:18px 18px 0 0; padding:26px 24px 28px;
    transform:translateY(30px); transition:transform .25s ease;
  }
  @media (min-width:640px){ .sheet{border-radius:14px; transform:scale(.97); } }
  .overlay.show .sheet{transform:translateY(0) scale(1);}
  .sheet-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .sheet-head h3{font-size:20px;}
  .close-x{background:none; border:0; font-size:20px; color:var(--ink-soft); line-height:1;}
  .cart-line{display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); align-items:center;}
  .cart-line img{width:52px; height:52px; object-fit:cover; border-radius:4px; background:#EFE8D6;}
  .cart-line .ci-name{font-size:14px; font-weight:500;}
  .cart-line .ci-price{font-size:12px; color:var(--ink-soft);}
  .cart-line .ci-right{margin-left:auto; display:flex; flex-direction:column; align-items:flex-end; gap:6px;}
  .remove-link{font-size:11px; color:var(--ink-soft); text-decoration:underline; background:none; border:0; padding:0;}
  .cart-total{display:flex; justify-content:space-between; padding-top:14px; font-family:'Fraunces',serif; font-size:19px;}
  .field{margin-top:14px;}
  .field label{display:block; font-size:12px; color:var(--ink-soft); margin-bottom:5px; font-weight:600;}
  .field input, .field textarea{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
    font-family:inherit; font-size:14px; background:var(--white); color:var(--ink);
  }
  .field textarea{resize:vertical; min-height:56px;}
  .whatsapp-btn{
    margin-top:20px; width:100%; padding:13px 0; border:0; border-radius:30px;
    background:#3f5d3a; color:#fff; font-size:14.5px; font-weight:700;
    display:flex; align-items:center; justify-content:center; gap:9px;
  }
  .whatsapp-btn:disabled{opacity:.45; cursor:not-allowed;}
  .whatsapp-btn svg{width:18px; height:18px; fill:#fff;}
  .form-note{font-size:11.5px; color:var(--ink-soft); margin-top:10px; text-align:center;}

  /* ---------- footer ---------- */
  footer.site{
    text-align:center; padding:26px 20px 34px; font-size:11.5px; color:var(--ink-soft);
    border-top:1px solid var(--line);
  }
  footer.site .admin-gear{
    display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px; margin-left:2px; vertical-align:middle;
    border-radius:50%; text-decoration:none; opacity:.4; font-size:15px;
    color:var(--ink-soft);
  }
  footer.site .admin-gear:active{ opacity:.8; background:var(--line); }

  /* ================= ADMIN ================= */
  .admin-wrap{max-width:960px; margin:0 auto; padding:40px 24px 100px;}
  .admin-topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:28px; padding-bottom:16px; border-bottom:1px solid var(--line);
  }
  .admin-topbar h2{font-size:22px;}
  .back-link{font-size:13px; color:var(--ink-soft); text-decoration:none;}
  .lock-screen{
    max-width:340px; margin:14vh auto 0; text-align:center; padding:0 20px;
  }
  .lock-screen .seal{width:56px; margin:0 auto 18px; display:block; opacity:.85;}
  .lock-screen h3{font-size:20px; margin-bottom:6px;}
  .lock-screen p{color:var(--ink-soft); font-size:13px; margin-bottom:18px;}
  .lock-screen input{
    width:100%; padding:11px 14px; border:1px solid var(--line); border-radius:8px;
    font-size:15px; text-align:center; letter-spacing:.1em;
  }
  .lock-screen button{
    margin-top:12px; width:100%; padding:11px 0; border:0; border-radius:8px;
    background:var(--ink); color:var(--paper); font-weight:600; font-size:13.5px;
  }
  .lock-err{color:#a4453a; font-size:12.5px; margin-top:8px; min-height:16px;}

  .tabs{display:flex; gap:6px; margin-bottom:24px; flex-wrap:wrap;}
  .tab-btn{
    padding:8px 16px; border:1px solid var(--line); background:var(--card);
    border-radius:20px; font-size:12.8px; font-weight:600; color:var(--ink-soft);
  }
  .tab-btn.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}

  .admin-card{
    background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px;
    margin-bottom:16px;
  }
  .admin-card h4{font-size:15px; margin-bottom:14px;}
  .prod-row{
    display:flex; gap:14px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line);
  }
  .prod-row:last-child{border-bottom:0;}
  .prod-row img{width:50px; height:50px; object-fit:cover; border-radius:6px; background:#EFE8D6;}
  .prod-row .pi-name{font-weight:600; font-size:14px;}
  .prod-row .pi-meta{font-size:12px; color:var(--ink-soft);}
  .prod-row .pi-actions{margin-left:auto; display:flex; gap:8px;}
  .icon-btn{
    border:1px solid var(--line); background:var(--white); border-radius:6px; padding:6px 11px; font-size:12px;
  }
  .icon-btn.danger{color:#a4453a; border-color:#e6c9c4;}
  .icon-btn.primary{background:var(--ink); color:var(--paper); border-color:var(--ink);}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:560px){.grid2{grid-template-columns:1fr;}}
  .imgtabs{display:flex; gap:8px; margin-bottom:8px;}
  .imgtab{padding:5px 12px; font-size:11.5px; border:1px solid var(--line); border-radius:14px; background:var(--white); color:var(--ink-soft);}
  .imgtab.active{background:var(--gold); color:#fff; border-color:var(--gold);}
  .img-preview{width:80px; height:80px; object-fit:cover; border-radius:8px; margin-top:8px; background:#EFE8D6; display:none;}
  .save-btn{
    margin-top:16px; padding:10px 22px; background:var(--gold-deep); color:#fff; border:0;
    border-radius:20px; font-weight:600; font-size:13px;
  }
  .cancel-btn{
    margin-top:16px; margin-left:8px; padding:10px 18px; background:none; color:var(--ink-soft);
    border:1px solid var(--line); border-radius:20px; font-size:13px;
  }
  .stat-row{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:20px;}
  .stat{
    background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 20px; flex:1; min-width:140px;
  }
  .stat .num{font-family:'Fraunces',serif; font-size:26px; color:var(--gold-deep);}
  .stat .label{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .order-item{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .order-item:last-child{border-bottom:0;}
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--paper); padding:11px 20px; border-radius:24px;
    font-size:13px; opacity:0; pointer-events:none; transition:all .25s ease; z-index:100;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .helptext{font-size:11.5px; color:var(--ink-soft); margin-top:4px;}
</style>
</head>

<div id="app"></div>
<div class="toast" id="toast"></div>

const DEFAULT_SETTINGS = { whatsappNumber: "", adminPassword: "lokale2026" };

const SEED_PRODUCTS = [
  {id:"p1", name:"Hulu Pudi", description:"Made fresh in small batches.", price:180, unit:"g", step:250, image:"", orders:0},
  {id:"p2", name:"Kodbale", description:"Made fresh in small batches.", price:150, unit:"g", step:250, image:"", orders:0},
  {id:"p3", name:"Nippattu", description:"Made fresh in small batches.", price:160, unit:"g", step:200, image:"", orders:0},
  {id:"p4", name:"Mysore Pak", description:"Made fresh in small batches.", price:220, unit:"g", step:250, image:"", orders:0}
];

const UNIT_LABELS = {
  pcs: "pc", g: "g", kg: "kg", ml: "ml", l: "L"
};
function packLabel(p){
  const step = p.step || 1;
  const unit = p.unit || "pcs";
  return `${step} ${UNIT_LABELS[unit] || unit}`;
}
function qtyLabel(steps, p){
  const step = p.step || 1;
  const unit = p.unit || "pcs";
  const amount = steps * step;
  return `${amount} ${UNIT_LABELS[unit] || unit}`;
}

let store = { products: null, settings: null };
let memoryFallback = false;

async function storageGet(key, shared){
  try{
    const r = await window.storage.get(key, shared);
    return r ? JSON.parse(r.value) : null;
  }catch(e){ return null; }
}
async function storageSet(key, value, shared){
  try{
    await window.storage.set(key, JSON.stringify(value), shared);
    return true;
  }catch(e){ memoryFallback = true; return false; }
}

async function loadData(){
  let products = await storageGet("lokale:products", true);
  let settings = await storageGet("lokale:settings", true);
  if(!products){ products = SEED_PRODUCTS; await storageSet("lokale:products", products, true); }
  if(!settings){ settings = DEFAULT_SETTINGS; await storageSet("lokale:settings", settings, true); }
  store.products = products;
  store.settings = settings;
}
async function saveProducts(){ await storageSet("lokale:products", store.products, true); }
async function saveSettings(){ await storageSet("lokale:settings", store.settings, true); }

function money(n){ return "₹" + Number(n).toFixed(0); }
function uid(){ return "p" + Math.random().toString(36).slice(2,9); }
function esc(s){ return String(s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove("show"), 2200);
}

/* ---------------- cart (session only, per visitor) ---------------- */
let cart = {}; // id -> qty

function cartCount(){ return Object.values(cart).reduce((a,b)=>a+b,0); }
function cartTotal(){
  return Object.entries(cart).reduce((sum,[id,qty])=>{
    const p = store.products.find(p=>p.id===id);
    return sum + (p ? p.price*qty : 0);
  },0);
}

   ============================================================ */
function currentRoute(){
  return location.hash.startsWith("#admin") ? "admin" : "store";
}
window.addEventListener("hashchange", render);

async function init(){
  await loadData();
  render();
}

function render(){
  const root = document.getElementById("app");
  if(currentRoute()==="admin"){
    root.innerHTML = adminShell();
    mountAdmin();
  }else{
    root.innerHTML = storeShell();
    mountStore();
  }
}

function productCard(p){
  const qty = cart[p.id] || 0;
  const img = p.image
    ? `<div class="photo" style="background-image:url('${p.image}')"></div>`
    : `<div class="photo"><span class="no-img">Lokalé</span></div>`;
  return `
  <div class="card" data-id="${p.id}">
    ${img}
    <div class="body">
      <h4>${esc(p.name)}</h4>
      <div class="desc">${esc(p.description||"")}</div>
      <div class="row">
        <span class="price">${money(p.price)} <span style="font-size:11px;color:var(--ink-soft);font-family:'Work Sans',sans-serif;">/ ${packLabel(p)}</span></span>
        <div class="stepper">
          <button class="dec" aria-label="Decrease">−</button>
          <span class="qty">${qty>0 ? qtyLabel(qty,p) : "0"}</span>
          <button class="inc" aria-label="Increase">+</button>
        </div>
      </div>
      <button class="add-btn ${qty>0?'added':''}">${qty>0? 'In your order' : 'Add to order'}</button>
    </div>
  </div>`;
}

function mountStore(){
  const grid = document.getElementById("grid");
  const list = store.products.filter(p=>p.active!==false);
  document.getElementById("prodCount").textContent = list.length + (list.length===1?" item":" items");
  grid.innerHTML = list.length ? list.map(productCard).join("") :
    `<div class="empty-catalog" style="grid-column:1/-1">Nothing listed yet — check back soon.</div>`;

  grid.querySelectorAll(".card").forEach(card=>{
    const id = card.dataset.id;
    const p = store.products.find(pp=>pp.id===id);
    const qtyEl = card.querySelector(".qty");
    const addBtn = card.querySelector(".add-btn");
    const bump = (delta)=>{
      const next = Math.max(0,(cart[id]||0)+delta);
      if(next===0) delete cart[id]; else cart[id]=next;
      qtyEl.textContent = cart[id] ? qtyLabel(cart[id],p) : "0";
      addBtn.textContent = cart[id] ? "In your order" : "Add to order";
      addBtn.classList.toggle("added", !!cart[id]);
      updateTray();
    };
    card.querySelector(".inc").onclick = ()=>bump(1);
    card.querySelector(".dec").onclick = ()=>bump(-1);
    addBtn.onclick = ()=>{ if(!cart[id]) bump(1); else openCart(); };
  });

  document.getElementById("trayBtn").onclick = openCart;
  document.getElementById("navCart").onclick = (e)=>{ e.preventDefault(); openCart(); };
  document.getElementById("cartOverlay").onclick = (e)=>{ if(e.target.id==="cartOverlay") closeCart(); };
  const gear = document.querySelector(".admin-gear");
  if(gear){
    gear.onclick = (e)=>{
      e.preventDefault();
      location.hash = "admin";
      render();
    };
  }

  updateTray();
}

function updateTray(){
  const c = cartCount();
  const tray = document.getElementById("tray");
  const navCount = document.getElementById("navCartCount");
  document.getElementById("trayCount").textContent = c;
  document.getElementById("trayTotal").textContent = money(cartTotal());
  tray.classList.toggle("show", c>0);
  if(navCount){ navCount.style.display = c>0 ? "inline-flex" : "none"; navCount.textContent=c; }
}

function openCart(){
  document.getElementById("cartSheet").innerHTML = cartSheetHTML();
  document.getElementById("cartOverlay").classList.add("show");
  bindCartSheet();
}
function closeCart(){ document.getElementById("cartOverlay").classList.remove("show"); }

function cartSheetHTML(){
  const items = Object.keys(cart);
  if(items.length===0){
    return `<div class="sheet-head"><h3>Your order</h3><button class="close-x" id="closeCart">✕</button></div>
    <p style="color:var(--ink-soft); font-size:14px;">Your order is empty. Add something from the catalog first.</p>`;
  }
  const lines = items.map(id=>{
    const p = store.products.find(p=>p.id===id);
    if(!p) return "";
    const img = p.image ? `<img src="${p.image}">` : `<img src="" style="background:#EFE8D6">`;
    return `<div class="cart-line" data-id="${id}">
      ${img}
      <div>
        <div class="ci-name">${esc(p.name)}</div>
        <div class="ci-price">${money(p.price)} × ${qtyLabel(cart[id],p)}</div>
      </div>
      <div class="ci-right">
        <div>${money(p.price*cart[id])}</div>
        <button class="remove-link">Remove</button>
      </div>
    </div>`;
  }).join("");

  return `
  <div class="sheet-head"><h3>Your order</h3><button class="close-x" id="closeCart">✕</button></div>
  ${lines}
  <div class="cart-total"><span>Total</span><span>${money(cartTotal())}</span></div>

  <div class="field">
    <label for="custName">Your name</label>
    <input id="custName" placeholder="Full name" autocomplete="name">
  </div>
  <div class="field">
    <label for="custAddress">Delivery address</label>
    <textarea id="custAddress" placeholder="Street, area, city"></textarea>
  </div>
  <div class="field">
    <label for="custNote">Note for us (optional)</label>
    <input id="custNote" placeholder="e.g. leave at the door">
  </div>

  <button class="whatsapp-btn" id="sendWhatsapp">
    <svg viewBox="0 0 24 24"><path d="M17.5 14.4c-.3-.1-1.7-.9-2-1s-.5-.1-.7.1-.8 1-.9 1.2-.3.2-.6.1a7.6 7.6 0 0 1-3.7-3.2c-.3-.5.3-.5.8-1.5.1-.2 0-.4 0-.5s-.7-1.6-.9-2.2c-.2-.5-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.2 3.4 5.3 4.7.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.7-.7 2-1.4.2-.6.2-1.2.2-1.3s-.2-.2-.4-.3z"/><path d="M12 2C6.5 2 2 6.5 2 12c0 1.9.5 3.6 1.4 5.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.7 0-3.4-.5-4.8-1.3l-.3-.2-2.9.8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2z"/></svg>
    Send order on WhatsApp
  </button>
  <div class="form-note">We'll open WhatsApp with your order pre-filled — just hit send.</div>
  `;
}

function bindCartSheet(){
  document.getElementById("closeCart").onclick = closeCart;
  document.querySelectorAll(".remove-link").forEach(btn=>{
    btn.onclick = (e)=>{
      const id = e.target.closest(".cart-line").dataset.id;
      delete cart[id];
      document.getElementById("cartSheet").innerHTML = cartSheetHTML();
      bindCartSheet();
      mountStore();
    };
  });
  const sendBtn = document.getElementById("sendWhatsapp");
  if(sendBtn){
    sendBtn.onclick = onSendWhatsapp;
  }
}

async function onSendWhatsapp(){
  const name = document.getElementById("custName").value.trim();
  const address = document.getElementById("custAddress").value.trim();
  const note = document.getElementById("custNote").value.trim();

  if(!name || !address){
    showToast("Please add your name and delivery address");
    return;
  }
  if(!store.settings.whatsappNumber){
    showToast("Ordering isn't set up yet — admin needs to add a WhatsApp number");
    return;
  }

  const items = Object.keys(cart);
  const lines = items.map(id=>{
    const p = store.products.find(p=>p.id===id);
    return `• ${p.name} × ${qtyLabel(cart[id],p)} — ${money(p.price*cart[id])}`;
  });

  const msg =
`*New order — Lokalé*

*Customer:* ${name}
*Address:* ${address}
${note ? `*Note:* ${note}\n` : ""}
*Order details:*
${lines.join("\n")}

*Total: ${money(cartTotal())}*`;

  // increment order counts (in real units, e.g. grams/pieces/litres)
  items.forEach(id=>{
    const p = store.products.find(p=>p.id===id);
    if(p) p.orders = (p.orders||0) + cart[id] * (p.step||1);
  });
  await saveProducts();

  const phone = store.settings.whatsappNumber.replace(/[^0-9]/g,"");
  const url = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
  window.open(url, "_blank");

  cart = {};
  closeCart();
  mountStore();
  showToast("Order sent — opening WhatsApp");
}

/* ============================================================
   ADMIN
   ============================================================ */
let adminUnlocked = false;
let adminTab = "products";
let editingProduct = null; // null = not editing, {} = new, object = existing

function adminShell(){
  if(!adminUnlocked){
    return `
    <div class="lock-screen">
      <img class="seal" src="${LOGO_SRC}" alt="">
      <h3>Owner login</h3>
      <p>This page is only for whoever manages Lokalé — bookmark this link, it isn't shown anywhere on the storefront.</p>
      <div style="position:relative;">
        <input type="password" id="adminPass" placeholder="Password" autocomplete="current-password" style="padding-right:44px;">
        <button id="togglePassBtn" type="button" style="position:absolute; right:6px; top:50%; transform:translateY(-50%); background:none; border:0; font-size:11.5px; color:var(--ink-soft); padding:4px 8px;">Show</button>
      </div>
      <button id="adminUnlockBtn">Log in</button>
      <div class="lock-err" id="lockErr"></div>
      <p style="margin-top:22px;"><a class="back-link" href="#">← Back to storefront</a></p>
    </div>`;
  }
  return `
  <div class="admin-wrap">
    <div class="admin-topbar">
      <h2>Admin — Lokalé</h2>
      <a class="back-link" href="#">View storefront →</a>
    </div>
    <div class="tabs">
      <button class="tab-btn ${adminTab==='products'?'active':''}" data-tab="products">Products</button>
      <button class="tab-btn ${adminTab==='orders'?'active':''}" data-tab="orders">Orders</button>
      <button class="tab-btn ${adminTab==='settings'?'active':''}" data-tab="settings">Settings</button>
    </div>
    <div id="adminBody"></div>
  </div>`;
}

function mountAdmin(){
  document.querySelectorAll('a[href="#"]').forEach(a=>{
    a.onclick = (e)=>{ e.preventDefault(); location.hash=""; render(); };
  });
  if(!adminUnlocked){
    const passField = document.getElementById("adminPass");
    document.getElementById("adminUnlockBtn").onclick = tryUnlock;
    passField.addEventListener("keydown", e=>{ if(e.key==="Enter") tryUnlock(); });
    passField.focus();
    document.getElementById("togglePassBtn").onclick = (e)=>{
      const show = passField.type === "password";
      passField.type = show ? "text" : "password";
      e.target.textContent = show ? "Hide" : "Show";
    };
    return;
  }
  document.querySelectorAll(".tab-btn").forEach(btn=>{
    btn.onclick = ()=>{ adminTab = btn.dataset.tab; editingProduct=null; renderAdminBody(); document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b===btn)); };
  });
  renderAdminBody();
}

function tryUnlock(){
  const val = document.getElementById("adminPass").value;
  if(val === store.settings.adminPassword){
    adminUnlocked = true;
    render();
  }else{
    document.getElementById("lockErr").textContent = "Incorrect password";
  }
}

function renderAdminBody(){
  const el = document.getElementById("adminBody");
  if(adminTab==="products") el.innerHTML = productsTabHTML();
  if(adminTab==="orders") el.innerHTML = ordersTabHTML();
  if(adminTab==="settings") el.innerHTML = settingsTabHTML();
  bindAdminBody();
}

/* ---- Products tab ---- */
function productsTabHTML(){
  if(editingProduct !== null){
    return productFormHTML(editingProduct);
  }
  const rows = store.products.map(p=>`
    <div class="prod-row" data-id="${p.id}">
      ${p.image ? `<img src="${p.image}">` : `<div style="width:50px;height:50px;border-radius:6px;background:#EFE8D6"></div>`}
      <div>
        <div class="pi-name">${esc(p.name)} ${p.active===false?'<span style="color:#a4453a;font-size:11px;">(hidden)</span>':''}</div>
        <div class="pi-meta">${money(p.price)} / ${packLabel(p)} · ${p.orders||0} ${UNIT_LABELS[p.unit||'pcs']||''} ordered</div>
      </div>
      <div class="pi-actions">
        <button class="icon-btn edit-p">Edit</button>
        <button class="icon-btn danger del-p">Delete</button>
      </div>
    </div>`).join("");
  return `
  <div class="admin-card">
    <h4>Products (${store.products.length})</h4>
    ${rows || '<p style="color:var(--ink-soft);font-size:13px;">No products yet.</p>'}
  </div>
  <button class="icon-btn primary" id="addProductBtn">+ Add product</button>
  `;
}

function productFormHTML(p){
  const isNew = !p.id;
  const unit = p.unit || "pcs";
  const step = p.step != null ? p.step : 1;
  return `
  <div class="admin-card">
    <h4>${isNew? "Add product" : "Edit product"}</h4>
    <div class="grid2">
      <div class="field"><label>Name</label><input id="f_name" value="${esc(p.name||"")}" placeholder="e.g. Kodbale"></div>
      <div class="field"><label>Price (per pack)</label><input id="f_price" type="number" step="0.01" min="0" value="${p.price!=null?p.price:""}" placeholder="0.00"></div>
    </div>
    <div class="field"><label>Description</label><textarea id="f_desc" placeholder="Short description">${esc(p.description||"")}</textarea></div>

    <div class="grid2">
      <div class="field">
        <label>Sold by</label>
        <select id="f_unit" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:14px;background:var(--white);">
          <option value="pcs" ${unit==='pcs'?'selected':''}>Pieces</option>
          <option value="g" ${unit==='g'?'selected':''}>Grams</option>
          <option value="kg" ${unit==='kg'?'selected':''}>Kilograms</option>
          <option value="ml" ${unit==='ml'?'selected':''}>Millilitres</option>
          <option value="l" ${unit==='l'?'selected':''}>Litres</option>
        </select>
      </div>
      <div class="field">
        <label>Pack size (per price above)</label>
        <input id="f_step" type="number" min="1" step="1" value="${step}" placeholder="e.g. 250">
      </div>
    </div>
    <div class="helptext" id="packPreview">Customers will order in packs of ${step} ${UNIT_LABELS[unit]||unit} at ${money(p.price||0)} each.</div>

    <div class="field" style="margin-top:14px;">
      <label>Photo</label>
      <div class="imgtabs">
        <button class="imgtab active" id="tabUrl">Image link</button>
        <button class="imgtab" id="tabUpload">Upload file</button>
      </div>
      <input id="f_imageUrl" placeholder="https://..." value="${p.image && p.image.startsWith('http')? esc(p.image):''}">
      <input id="f_imageFile" type="file" accept="image/*" class="hide">
      <img id="imgPreview" class="img-preview" src="${p.image && !p.image.startsWith('http')? p.image:''}" style="${p.image && !p.image.startsWith('http')?'display:block':''}">
      <div class="helptext">Paste a link, or switch to upload a photo from your device.</div>
    </div>

    <label style="display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;">
      <input type="checkbox" id="f_active" ${p.active===false?'':'checked'} style="width:auto;"> Visible in storefront
    </label>

    <button class="save-btn" id="saveProductBtn">Save product</button>
    <button class="cancel-btn" id="cancelProductBtn">Cancel</button>
  </div>`;
}

function bindAdminBody(){
  if(adminTab==="products"){
    if(editingProduct!==null){
      bindProductForm();
    }else{
      const addBtn = document.getElementById("addProductBtn");
      if(addBtn) addBtn.onclick = ()=>{ editingProduct = {}; renderAdminBody(); };
      document.querySelectorAll(".edit-p").forEach(btn=>{
        btn.onclick = (e)=>{
          const id = e.target.closest(".prod-row").dataset.id;
          editingProduct = {...store.products.find(p=>p.id===id)};
          renderAdminBody();
        };
      });
      document.querySelectorAll(".del-p").forEach(btn=>{
        btn.onclick = async (e)=>{
          const id = e.target.closest(".prod-row").dataset.id;
          const p = store.products.find(p=>p.id===id);
          if(confirm(`Delete "${p.name}"? This can't be undone.`)){
            store.products = store.products.filter(p=>p.id!==id);
            await saveProducts();
            renderAdminBody();
            showToast("Product deleted");
          }
        };
      });
    }
  }
  if(adminTab==="settings") bindSettingsTab();
}

function bindProductForm(){
  const urlTab = document.getElementById("tabUrl");
  const upTab = document.getElementById("tabUpload");
  const urlInput = document.getElementById("f_imageUrl");
  const fileInput = document.getElementById("f_imageFile");
  const preview = document.getElementById("imgPreview");
  const unitSel = document.getElementById("f_unit");
  const stepInput = document.getElementById("f_step");
  const priceInput = document.getElementById("f_price");
  const packPreview = document.getElementById("packPreview");

  const refreshPreview = ()=>{
    const step = parseFloat(stepInput.value) || 1;
    const unit = unitSel.value;
    const price = parseFloat(priceInput.value) || 0;
    packPreview.textContent = `Customers will order in packs of ${step} ${UNIT_LABELS[unit]||unit} at ${money(price)} each.`;
  };
  unitSel.onchange = refreshPreview;
  stepInput.oninput = refreshPreview;
  priceInput.oninput = refreshPreview;

  urlTab.onclick = ()=>{ urlTab.classList.add("active"); upTab.classList.remove("active"); urlInput.classList.remove("hide"); fileInput.classList.add("hide"); };
  upTab.onclick = ()=>{ upTab.classList.add("active"); urlTab.classList.remove("active"); fileInput.classList.remove("hide"); urlInput.classList.add("hide"); };
  urlInput.classList.remove("hide");
  fileInput.classList.add("hide");

  urlInput.oninput = ()=>{
    if(urlInput.value){ preview.src = urlInput.value; preview.style.display="block"; }
  };
  fileInput.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = ()=>{
        const canvas = document.createElement("canvas");
        const max = 700;
        let w = img.width, h = img.height;
        if(w>h && w>max){ h = h*max/w; w = max; }
        else if(h>=w && h>max){ w = w*max/h; h = max; }
        canvas.width=w; canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        const dataUrl = canvas.toDataURL("image/jpeg", 0.82);
        preview.src = dataUrl;
        preview.style.display = "block";
        preview.dataset.uploaded = dataUrl;
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };

  document.getElementById("cancelProductBtn").onclick = ()=>{ editingProduct=null; renderAdminBody(); };
  document.getElementById("saveProductBtn").onclick = async ()=>{
    const name = document.getElementById("f_name").value.trim();
    const price = parseFloat(document.getElementById("f_price").value);
    const description = document.getElementById("f_desc").value.trim();
    const active = document.getElementById("f_active").checked;
    const unit = unitSel.value;
    const step = Math.max(1, parseFloat(stepInput.value) || 1);
    if(!name || isNaN(price)){
      showToast("Please add a name and a valid price");
      return;
    }
    let image = editingProduct.image || "";
    if(preview.dataset.uploaded){ image = preview.dataset.uploaded; }
    else if(urlInput.value && !urlInput.classList.contains("hide")){ image = urlInput.value.trim(); }

    if(editingProduct.id){
      const idx = store.products.findIndex(p=>p.id===editingProduct.id);
      store.products[idx] = {...store.products[idx], name, price, description, active, image, unit, step};
    }else{
      store.products.push({ id: uid(), name, price, description, active, image, unit, step, orders:0 });
    }
    await saveProducts();
    editingProduct = null;
    renderAdminBody();
    showToast("Product saved");
  };
}

/* ---- Orders tab ---- */
function ordersTabHTML(){
  const totalUnits = store.products.reduce((s,p)=>s+(p.orders||0),0);
  const totalRevenue = store.products.reduce((s,p)=>s+((p.orders||0)/(p.step||1))*p.price,0);
  const rows = [...store.products].sort((a,b)=>(b.orders||0)-(a.orders||0)).map(p=>`
    <div class="order-item"><span>${esc(p.name)}</span><span>${p.orders||0} ${UNIT_LABELS[p.unit||'pcs']||''}</span></div>
  `).join("");
  return `
  <div class="stat-row">
    <div class="stat"><div class="num">${totalUnits}</div><div class="label">total units ordered</div></div>
    <div class="stat"><div class="num">${money(totalRevenue)}</div><div class="label">est. revenue</div></div>
    <div class="stat"><div class="num">${store.products.length}</div><div class="label">products listed</div></div>
  </div>
  <div class="admin-card">
    <h4>Units ordered by product</h4>
    ${rows || '<p style="color:var(--ink-soft);font-size:13px;">No orders yet.</p>'}
  </div>
  <div class="helptext">Order counts update automatically each time a customer sends an order on WhatsApp.</div>
  `;
}

/* ---- Settings tab ---- */
function settingsTabHTML(){
  return `
  <div class="admin-card">
    <h4>WhatsApp order number</h4>
    <div class="field">
      <label>Number (with country code, no + or spaces)</label>
      <input id="s_whatsapp" placeholder="e.g. 14155552671" value="${esc(store.settings.whatsappNumber||"")}">
    </div>
    <div class="helptext">This is the number every customer order will be sent to. Use the full international number, digits only.</div>
    <button class="save-btn" id="saveWhatsapp">Save number</button>
  </div>

  <div class="admin-card">
    <h4>Admin password</h4>
    <div class="field"><label>New password</label><input id="s_pass1" type="password" placeholder="New password"></div>
    <div class="field"><label>Confirm new password</label><input id="s_pass2" type="password" placeholder="Confirm password"></div>
    <button class="save-btn" id="savePassword">Update password</button>
  </div>
  `;
}

function bindSettingsTab(){
  document.getElementById("saveWhatsapp").onclick = async ()=>{
    store.settings.whatsappNumber = document.getElementById("s_whatsapp").value.trim();
    await saveSettings();
    showToast("WhatsApp number saved");
  };
  document.getElementById("savePassword").onclick = async ()=>{
    const p1 = document.getElementById("s_pass1").value;
    const p2 = document.getElementById("s_pass2").value;
    if(!p1 || p1.length<4){ showToast("Password should be at least 4 characters"); return; }
    if(p1!==p2){ showToast("Passwords don't match"); return; }
    store.settings.adminPassword = p1;
    await saveSettings();
    showToast("Password updated");
  };
}

init();
</script>
